services:
  web:
    build: .
    container_name: powerletters_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # URL interna del agente Hermes (red docker)
      HERMES_URL: http://hermes:8091
      HERMES_INTERNAL_TOKEN: ${HERMES_INTERNAL_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_libros:/var/www/html/api/images/libros
      - uploads_usuarios:/var/www/html/api/images/usuarios
      - php_sessions:/var/lib/php/sessions

  hermes:
    build: ./agent
    container_name: powerletters_hermes
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      HERMES_INTERNAL_TOKEN: ${HERMES_INTERNAL_TOKEN}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: powerletters_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./resources/sql/PowerLetters.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./resources/sql/insercion_de_usuarios.sql:/docker-entrypoint-initdb.d/02-usuarios.sql:ro
      - ./resources/sql/inserción_base.sql:/docker-entrypoint-initdb.d/03-base.sql:ro
      - ./resources/sql/zz_hash_passwords.sql:/docker-entrypoint-initdb.d/99-hashes.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads_libros:
  uploads_usuarios:
  php_sessions:
